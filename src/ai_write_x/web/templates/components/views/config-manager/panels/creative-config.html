<div id="config-creative" class="config-panel creative-config-panel">
    <div class="config-header">
        <div class="header-content">
            <div>
                <h2>维度化创意</h2>
                <p class="config-description">让文章更有个性和表现力</p>
            </div>
        </div>
        <div class="header-actions">
            <button type="button" class="btn btn-secondary" id="reset-creative-config">恢复默认</button>
            <button type="button" class="btn btn-primary" id="save-creative-config">保存设置</button>
        </div>
    </div>

    <div class="config-form creative-config-form">
        
        <!-- 总开关 -->
        <div class="form-group">
            <label class="form-checkbox">
                <input type="checkbox" id="creative-enabled">
                <span>启用维度化创意</span>
            </label>
            <p class="form-help">关闭后生成流程不再做创意改写</p>
        </div>

        <!-- 主内容区 -->
        <div id="creative-main-content" style="display: none;">
            
            <!-- 快速场景选择 -->
            <div class="form-section">
                <h3 class="form-section-title">🎯 快速场景</h3>
                <p class="form-section-desc">一键应用预设的维度组合</p>
                <div class="creative-scenario-cards">
                    <label class="creative-scenario-card">
                        <input type="radio" name="scenario" value="professional">
                        <span class="card-inner">
                            <span class="card-icon">📊</span>
                            <span class="card-title">职场专业</span>
                            <span class="card-desc">商业分析、技术报告</span>
                        </span>
                    </label>
                    <label class="creative-scenario-card">
                        <input type="radio" name="scenario" value="humorous">
                        <span class="card-inner">
                            <span class="card-icon">🎭</span>
                            <span class="card-title">轻松吐槽</span>
                            <span class="card-desc">生活吐槽、热点评论</span>
                        </span>
                    </label>
                    <label class="creative-scenario-card">
                        <input type="radio" name="scenario" value="narrative">
                        <span class="card-inner">
                            <span class="card-icon">📖</span>
                            <span class="card-title">故事讲述</span>
                            <span class="card-desc">个人经历、情感故事</span>
                        </span>
                    </label>
                    <label class="creative-scenario-card">
                        <input type="radio" name="scenario" value="tech">
                        <span class="card-inner">
                            <span class="card-icon">💻</span>
                            <span class="card-title">技术科普</span>
                            <span class="card-desc">技术解析、科技评测</span>
                        </span>
                    </label>
                    <label class="creative-scenario-card">
                        <input type="radio" name="scenario" value="opinion">
                        <span class="card-inner">
                            <span class="card-icon">💭</span>
                            <span class="card-title">观点评论</span>
                            <span class="card-desc">深度评论、观点输出</span>
                        </span>
                    </label>
                    <label class="creative-scenario-card">
                        <input type="radio" name="scenario" value="lifestyle">
                        <span class="card-inner">
                            <span class="card-icon">🌟</span>
                            <span class="card-title">生活分享</span>
                            <span class="card-desc">生活方式、经验心得</span>
                        </span>
                    </label>
                    <label class="creative-scenario-card creative-scenario-custom">
                        <input type="radio" name="scenario" value="custom" checked>
                        <span class="card-inner">
                            <span class="card-icon">⚙️</span>
                            <span class="card-title">自定义</span>
                            <span class="card-desc">手动配置维度</span>
                        </span>
                    </label>
                </div>
            </div>

            <!-- 维度详细选择 -->
            <div class="form-section">
                <h3 class="form-section-title">🎨 自定义维度</h3>
                <p class="form-section-desc">精细控制每个创作维度</p>
                
                <div class="dimensions-grid">
                    <!-- 左列 -->
                    <div class="dimension-column">
                        <div class="dimension-card">
                            <h4 class="dimension-card-title">✍️ 文体表达</h4>
                            <div class="dimension-fields">
                                <div class="dimension-field">
                                    <label>语言风格</label>
                                    <select class="form-select" id="dim-language">
                                        <option value="">不限定</option>
                                        <option value="professional">📊 专业术语</option>
                                        <option value="modern">💬 现代口语</option>
                                        <option value="vivid">🎨 生动形象</option>
                                        <option value="casual">😎 随意轻松</option>
                                    </select>
                                </div>
                                <div class="dimension-field">
                                    <label>语气</label>
                                    <select class="form-select" id="dim-tone">
                                        <option value="">不限定</option>
                                        <option value="formal">🎩 正式</option>
                                        <option value="humorous">😄 幽默</option>
                                        <option value="sarcastic">😏 讽刺</option>
                                        <option value="gentle">🌸 温和</option>
                                        <option value="relaxed">☕ 轻松</option>
                                        <option value="provocative">⚡ 挑衅</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="dimension-card">
                            <h4 class="dimension-card-title">🎭 角色技法</h4>
                            <div class="dimension-fields">
                                <div class="dimension-field">
                                    <label>叙述视角</label>
                                    <select class="form-select" id="dim-perspective">
                                        <option value="">不限定</option>
                                        <option value="first_person">👤 第一人称</option>
                                        <option value="third_person">👥 第三人称</option>
                                    </select>
                                </div>
                                <div class="dimension-field">
                                    <label>修辞技巧</label>
                                    <select class="form-select" id="dim-technique">
                                        <option value="">不限定</option>
                                        <option value="analysis">📈 分析论证</option>
                                        <option value="satire">🎪 讽刺</option>
                                        <option value="humor">🤣 幽默</option>
                                        <option value="contrast">⚖️ 对比反差</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 右列 -->
                    <div class="dimension-column">
                        <div class="dimension-card">
                            <h4 class="dimension-card-title">📐 结构节奏</h4>
                            <div class="dimension-fields">
                                <div class="dimension-field">
                                    <label>结构方式</label>
                                    <select class="form-select" id="dim-structure">
                                        <option value="">不限定</option>
                                        <option value="logical">🔗 逻辑递进</option>
                                        <option value="cause_effect">🔄 因果关系</option>
                                        <option value="narrative">📚 故事叙述</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="dimension-card">
                            <h4 class="dimension-card-title">🎯 受众情感</h4>
                            <div class="dimension-fields">
                                <div class="dimension-field">
                                    <label>目标受众</label>
                                    <select class="form-select" id="dim-audience">
                                        <option value="">不限定</option>
                                        <option value="professionals">💼 专业人士</option>
                                        <option value="general">🌍 普通大众</option>
                                    </select>
                                </div>
                                <div class="dimension-field">
                                    <label>情感基调</label>
                                    <select class="form-select" id="dim-emotion">
                                        <option value="">不限定</option>
                                        <option value="empathy">💓 共鸣</option>
                                        <option value="warmth">🌞 温情</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 创意强度 -->
            <div class="form-section">
                <h3 class="form-section-title">💪 创意强度</h3>
                <div class="intensity-container">
                    <div class="intensity-info">
                        <span class="intensity-label">当前强度</span>
                        <span class="intensity-value" id="creative-intensity-display">0.8</span>
                    </div>
                    <input type="range" id="creative-intensity" class="form-slider" 
                           min="0.7" max="1.5" step="0.1" value="0.8">
                    <div class="slider-labels">
                        <span>保守 0.7</span>
                        <span>适中 1.0</span>
                        <span>激进 1.5</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
