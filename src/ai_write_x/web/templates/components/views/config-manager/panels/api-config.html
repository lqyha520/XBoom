<div id="config-api" class="config-panel llm-api-panel">
    <div class="config-header llm-api-page-header">
        <div class="header-content llm-api-page-title">
            <span class="llm-api-page-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M12 3a3 3 0 0 0-3 3v1a3 3 0 0 0-3 3v1a3 3 0 0 0 1 5.24V17a3 3 0 0 0 5 2.24A3 3 0 0 0 17 17v-.76A3 3 0 0 0 18 11v-1a3 3 0 0 0-3-3V6a3 3 0 0 0-3-3Z"/>
                    <path d="M9 7.5A2.5 2.5 0 0 0 11.5 10M15 7.5A2.5 2.5 0 0 1 12.5 10M9 15a3 3 0 0 1 3-3 3 3 0 0 1 3 3"/>
                </svg>
            </span>
            <div>
                <span class="llm-api-page-eyebrow">MODEL GATEWAY</span>
                <h2>大模型 API</h2>
                <p class="config-description">集中管理写作模型、密钥和备用能力，各厂商配置互不影响</p>
            </div>
        </div>
        <div class="header-actions">
            <span class="llm-api-local-safe"><span></span>密钥仅保存在本机</span>
            <button type="button" class="btn btn-secondary" id="reset-api-config">
                恢复默认
            </button>
            <button type="button" class="btn btn-primary" id="save-api-config">
                保存设置
            </button>
        </div>
    </div>

    <div class="config-form llm-api-config-form">
        <div id="api-provider-toolbar" class="api-provider-toolbar" role="region" aria-label="厂商选择与操作">
            <!-- JS: 厂商选择、状态、操作按钮 -->
        </div>

        <div id="api-providers-container" class="llm-api-detail-wrap">
            <!-- JS: 当前厂商配置表单 -->
        </div>

        <div id="custom-apis-container" class="hidden" aria-hidden="true"></div>

        <details class="llm-api-help-panel">
            <summary>配置说明与常见问题</summary>
            <div class="llm-api-help-body">
                <ul>
                    <li>通过下拉框切换厂商；每个厂商的 Key、模型<strong>独立保存</strong>。</li>
                    <li>API KEY 支持<strong>一行一个</strong>，系统自动轮换与重试。</li>
                    <li>配置后点击<strong>设为当前使用</strong>，写作才会使用该厂商。</li>
                    <li>修改后请点击右上角<strong>保存设置</strong>写入本地。</li>
                </ul>
            </div>
        </details>
    </div>
</div>
