name: deploy-server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xboom-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install pytest sqlmodel pydantic fastapi beautifulsoup4
          pyyaml requests pillow python-multipart jinja2 aiohttp tomlkit markdown
          openai httpx crewai==0.102.0 dashscope==1.22.1
      - name: Compile Python sources
        run: python -m compileall -q main.py server.py src/ai_write_x
      - name: Run core tests
        run: python -m pytest tests --tb=short -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SSH_HOST: ${{ secrets.XBOOM_SSH_HOST }}
      SSH_PORT: ${{ secrets.XBOOM_SSH_PORT }}
      SSH_USER: ${{ secrets.XBOOM_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.XBOOM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "$SSH_PORT" -t ed25519 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            test -s ~/.ssh/known_hosts && break
            sleep $((attempt * 5))
          done
          test -s ~/.ssh/known_hosts

      - name: Prepare incremental staging directory
        shell: bash
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          stage="/tmp/xboom-sync-${sha}"
          current="/www/wwwroot/xboom-current"
          rm -rf -- "$stage"
          mkdir -p "$stage"
          if [[ -f "$current/server.py" ]]; then
            for item in config knowledge scripts src server.py pyproject.toml requirements.txt version-policy.json README.md; do
              if [[ -e "$current/$item" ]]; then
                cp -al "$current/$item" "$stage/$item"
              fi
            done
          fi
          REMOTE

      - name: Sync changed source files
        shell: bash
        run: |
          stage="/tmp/xboom-sync-${GITHUB_SHA}/"
          success=0
          for attempt in 1 2 3; do
            if rsync -azc --delete --partial --timeout=120 \
              --exclude='*/node_modules/***' \
              --exclude='*/__pycache__/***' \
              --exclude='*.pyc' \
              --exclude='src/output/***' \
              -e "ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p ${SSH_PORT}" \
              config knowledge scripts src server.py pyproject.toml requirements.txt version-policy.json README.md \
              "${SSH_USER}@${SSH_HOST}:${stage}"; then
              success=1
              break
            fi
            sleep $((attempt * 10))
          done
          test "$success" = 1

      - name: Deploy synchronized release
        shell: bash
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          stage="/tmp/xboom-sync-${sha}"
          archive="/tmp/xboom-${sha}.tar.gz"
          test -f "$stage/server.py"
          test -f "$stage/scripts/deploy-blue-green.sh"
          tar -czf "$archive" -C "$stage" .
          install -m 0700 "$stage/scripts/deploy-blue-green.sh" /tmp/xboom-deploy.sh
          /tmp/xboom-deploy.sh deploy "$archive" "$sha"
          rm -rf -- "$stage"
          REMOTE

      - name: Verify public health
        shell: bash
        run: |
          response="$(curl -fsS --retry 5 --retry-delay 2 --max-time 15 "http://${SSH_HOST}:39005/health")"
          echo "$response"
          grep -q '"status":"healthy"' <<<"$response"
          grep -q "\"deployment_id\":\"${GITHUB_SHA}\"" <<<"$response"
