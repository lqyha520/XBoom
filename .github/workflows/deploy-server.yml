name: deploy-server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xboom-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install pytest sqlmodel pydantic fastapi beautifulsoup4
          pyyaml requests pillow python-multipart jinja2 aiohttp tomlkit markdown
          openai httpx crewai==0.102.0 dashscope==1.22.1
      - name: Compile Python sources
        run: python -m compileall -q main.py server.py src/ai_write_x
      - name: Run core tests
        run: python -m pytest tests --tb=short -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SSH_HOST: ${{ secrets.XBOOM_SSH_HOST }}
      SSH_PORT: ${{ secrets.XBOOM_SSH_PORT }}
      SSH_USER: ${{ secrets.XBOOM_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.XBOOM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -t ed25519 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true
          test -s ~/.ssh/known_hosts

      - name: Fetch commit and deploy blue-green release
        shell: bash
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '${GITHUB_SHA}' '${GITHUB_REPOSITORY}'" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          repository="$2"
          mirror="/www/wwwroot/xboom-git"
          archive="/tmp/xboom-${sha}.tar.gz"

          if [[ ! -d "$mirror/.git" ]]; then
            mkdir -p "$mirror"
            git -C "$mirror" init
            git -C "$mirror" remote add origin "https://github.com/${repository}.git"
          else
            git -C "$mirror" remote set-url origin "https://github.com/${repository}.git"
          fi

          git -C "$mirror" fetch --force --depth=1 origin "$sha"
          test "$(git -C "$mirror" rev-parse FETCH_HEAD)" = "$sha"
          git -C "$mirror" archive --format=tar.gz --output="$archive" "$sha" -- \
            config knowledge scripts src server.py pyproject.toml requirements.txt version-policy.json README.md
          git -C "$mirror" show "$sha:scripts/deploy-blue-green.sh" > /tmp/xboom-deploy.sh
          chmod 700 /tmp/xboom-deploy.sh
          /tmp/xboom-deploy.sh deploy "$archive" "$sha"
          REMOTE

      - name: Verify public health
        shell: bash
        run: |
          response="$(curl -fsS --retry 5 --retry-delay 2 --max-time 15 "http://${SSH_HOST}:39005/health")"
          echo "$response"
          grep -q '"status":"healthy"' <<<"$response"
          grep -q "\"deployment_id\":\"${GITHUB_SHA}\"" <<<"$response"
