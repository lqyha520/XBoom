name: quality-gate

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: >-
          python -m pip install pytest sqlmodel pydantic fastapi beautifulsoup4
          pyyaml requests pillow python-multipart jinja2 aiohttp tomlkit markdown
          openai httpx crewai==0.102.0

      - name: Compile Python sources
        run: python -m compileall -q main.py src/ai_write_x

      - name: Run core tests
        run: python -m pytest tests --tb=short -q

      - name: Check dependency consistency
        run: python -m pip check
